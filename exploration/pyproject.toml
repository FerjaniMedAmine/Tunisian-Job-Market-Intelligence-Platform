[project]
name = "jobmarket-exploration"
version = "0.1.0"
description = "Notebook exploration and SQL queries over Tunisian job market data in MinIO"
readme = "README.md"
authors = [
    { name = "amine", email = "amineferjani961@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.115",
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
